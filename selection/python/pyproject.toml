[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qlogicae-cor"
version = "1.0.4"
description = "The core library for QLogicae projects"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

authors = [
    { name = "Vaughn Cedric L. Araneta", email = "vaughncedriclipardoaraneta@gmail.com" }
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]

dependencies = []

[tool.setuptools]
package-dir = {"" = "library"}

[tool.setuptools.packages.find]
where = ["library"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true
warn_no_return = true
disallow_any_generics = true
disallow_any_unimported = true
explicit_package_bases = true
namespace_packages = true
files = ["library", "test"]

[tool.ruff]
target-version = "py314"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".output",
    "output",
    ".outputs",
    "outputs",
    ".dist",
    "dist",
    ".build",
    "build",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
    ".tox",
    ".nox",
    ".idea",
    ".vscode",
]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    "W",

    # Pyflakes
    "F",

    # isort
    "I",

    # pyupgrade
    "UP",

    # flake8-bugbear
    "B",

    # pathlib
    "PTH",

    # flake8-comprehensions
    # "C4",

    # flake8-simplify
    # "SIM",

    # flake8-return
    # "RET",

    # flake8-unused-arguments
    # "ARG",

    # flake8-builtins
    # "A",

    # flake8-bandit (security)
    # "S",

    # flake8-logging-format
    # "G",

    # flake8-pie
    # "PIE",

    # flake8-quotes
    # "Q",

    # eradicate (commented-out code)
    # "ERA",

    # Ruff-specific
    # "RUF",
]
ignore = [
    # allow assert statements
    "S101",

    # allow subprocess usage
    "S603",
    "S607",

    # allow magic values
    "PLR2004",
]
fixable = ["ALL"]
unfixable = []


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
skip-magic-trailing-comma = false

[tool.hatch.envs.default.scripts]
lint = "ruff check . --fix"
format = "ruff format ."
audit-security = "pip-audit"
deploy-check = "twine check ./output/build/*"
clean-build = "rm -rf ./output/build && mkdir -p ./output/build"
clean-test-unit = "rm -rf ./output/test/unit && mkdir -p ./output/test/unit"
clean-test-benchmark = "rm -rf ./output/test/benchmark && mkdir -p ./output/test/benchmark"
build = "hatch run clean-build && hatch build && mv dist/* ./output/build"
workflow-test-unit = "hatch run clean-test-unit && pytest -vv --cov=library --cov-branch --cov-report=term-missing --cov-report=html:./output/test/unit/html --cov-report=xml:./output/test/unit/coverage.xml --cov-report=json:./output/test/unit/coverage.json --junitxml=./output/test/unit/junit.xml"
workflow-test-benchmark = "clean-test-benchmark && pytest -vv --benchmark-enable --benchmark-json=./output/test/benchmark/benchmark.json"
workflow-deploy-check = "hatch run build && hatch run deploy-check"
workflow-deploy = "hatch run build && twine upload ./output/build/* --config-file .pypirc --verbose"

[tool.hatch.build]
include = [
    "library/**/*.py",
    "project/**/*",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
exclude = [
    "**/__pycache__/**",
    "**/*.pyc",
    ".github/**",
    "test/**",
    "docs/**",
    "docs/**",
]

