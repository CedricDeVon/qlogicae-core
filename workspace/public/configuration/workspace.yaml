
data:
  selection:
    is-enabled: true

    default:
      name: typescript
      targets:
        all:
          full-path: ${{ current-root-full-path }}

        root:
          full-path: ${{ current-root-full-path }}

        project:
          full-path: ${{ current-root-full-path }}

    project:
      targets:
        typescript:
          full-path: ${{ current-root-full-path }}/selection/typescript

        python:
          full-path: ${{ current-root-full-path }}/selection/python

        rust:
          full-path: ${{ current-root-full-path }}/selection/rust

  script:
    is-enabled: true

    targets:
      value-cache-debug:
        enter-full-path: ${{ current-root-full-path }}/workspace/public/toolset
        commands:
          - run: "python3 -c \"
              from library import workspace_manager, value_cache_storage_manager;
              workspace_manager.singleton.setup();
              value_cache_storage_manager.singleton.display_all_items();
              workspace_manager.singleton.shutdown();\""


      typescript-account-login:
        enter-full-path: ${{ current-root-full-path }}/selection/typescript
        commands:
          - run: npm login

      rust-account-login:
        enter-full-path: ${{ current-root-full-path }}/selection/rust
        commands:
          - run: cargo login ${{ rust-cargo-io-api-key }}



      typescript-toolset-verify:
        enter-full-path: ${{ current-root-full-path }}/selection/typescript
        commands:
          - run: docker --version
          - run: git --version
          - run: gh --version
          - run: node --version
          - run: fnm --version
          - run: npm --version
          - run: bun --version
          - run: bunx corepack --version
          - run: bunx pnpm --version
          - run: bunx yarn --version

      rust-toolset-verify:
        enter-full-path: ${{ current-root-full-path }}/selection/rust
        commands:
          - run: rustc --version
          - run: rustup --version
          - run: cargo --version
          - run: cargo fmt --version
          - run: cargo clippy --version
          - run: cargo nextest --version
          - run: cargo audit --version
          - run: rustup target list



      typescript-test-unit:
        enter-full-path: ${{ current-root-full-path }}/selection/typescript
        commands:
          - run: bun run test:unit

      rust-test-unit:
        enter-full-path: ${{ current-root-full-path }}/selection/rust
        commands:
          - run: cargo test-unit



      typescript-test-benchmark:
        enter-full-path: ${{ current-root-full-path }}/selection/typescript
        commands:
          - run: bun run test:benchmark

      rust-test-benchmark:
        enter-full-path: ${{ current-root-full-path }}/selection/rust
        commands:
          - run: echo "rust-test-benchmark"



      typescript-format:
        enter-full-path: ${{ current-root-full-path }}/selection/typescript
        commands:
          - run: bun run format

      rust-format:
        enter-full-path: ${{ current-root-full-path }}/selection/rust
        commands:
          - run: cargo format-check
          - run: cargo format-write



      typescript-lint:
        enter-full-path: ${{ current-root-full-path }}/selection/typescript
        commands:
          - run: bun run lint

      rust-lint:
        enter-full-path: ${{ current-root-full-path }}/selection/rust
        commands:
          - run: cargo lint



      typescript-build:
        enter-full-path: ${{ current-root-full-path }}/selection/typescript

        commands:
          - run: bun run build

      rust-build:
        enter-full-path: ${{ current-root-full-path }}/selection/rust

        commands:
          - run: cargo build-debug
          - run: cargo build-release



      typescript-setup:
        enter-full-path: ${{ current-root-full-path }}/selection/typescript
        commands:
          - run: bun install

      rust-setup:
        enter-full-path: ${{ current-root-full-path }}/selection/rust
        commands:
          - run: echo "rust-setup"



      typescript-update:
        enter-full-path: ${{ current-root-full-path }}/selection/typescript
        commands:
          - run: bun update

      rust-update:
        enter-full-path: ${{ current-root-full-path }}/selection/rust
        commands:
          - run: cargo update



      typescript-deploy-check:
        enter-full-path: ${{ current-root-full-path }}/selection/typescript
        commands:
          - run: bun run deploy:check

      rust-deploy-check:
        enter-full-path: ${{ current-root-full-path }}/selection/rust
        commands:
          - run: cargo deploy-inspect
          - run: cargo deploy-check



      typescript-deploy:
        enter-full-path: ${{ current-root-full-path }}/selection/typescript
        commands:
          - run: bun run workflow:deploy

      rust-deploy:
        enter-full-path: ${{ current-root-full-path }}/selection/rust
        commands:
          - run: cargo workflow-deploy


      git-hotfix:
        enter-full-path: ${{ current-root-full-path }}
        commands:
          - run: git add .
          - run: git commit -m 'hotfix'
          - run: git push origin

    clean:
      is-enabled: true

      exclude:
        targets:
          - name: ${{ current-root-full-path }}
          - name: ${{ current-root-full-path }}/selection
          - name: ${{ current-root-full-path }}/workspace
          - name: ${{ current-root-full-path }}/.github  
          - name: ${{ current-root-full-path }}/.temporary            

      include:
        targets:
          root-temporary:
            - name: ${{ current-root-full-path }}/workspace/private/temporary

          typescript-temporary:
            - name: ${{ current-root-full-path }}/selection/typescript/output

          rust-temporary:
            - name: ${{ current-root-full-path }}/selection/rust/target

  log:
    is-enabled: true

    targets:
      - name: ${{ current-root-full-path }}/workspace/private/temporary/log/${{ current-date }}.log            

  macros:  
    value-cache:
      targets:
        - name: current-date
        - name: current-year
        - name: current-root-full-path

    file:
      targets:
        - name: company-name
          value: QLogicae

        - name: project-name
          value: Cor
      
        - name: author-name
          value: Vaughn Cedric L. Araneta
      
        - name: author-email
          value: vaughncedriclipardoaraneta@gmail.com

metadata:

