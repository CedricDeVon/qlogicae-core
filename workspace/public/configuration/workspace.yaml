
data:
  selection:
    is-enabled: true

    target: typescript

    default:
      targets:
        - all
        - root
        - project

    project:
      targets:
        - typescript
        - python
        - rust

    full-path:
      root: ${{ current-root-full-path }}
      
      typescript: ${{ current-root-full-path }}/selection/typescript      
      
      python: ${{ current-root-full-path }}/selection/python

      rust: ${{ current-root-full-path }}/selection/rust


  script:
    is-enabled: true

    types:
      - individual
      - collection

    targets:
      value-cache-debug:
        enter-full-path: ${{ current-root-full-path }}/workspace/public/toolset
        type: individual
        commands:
          - "python3 -c \"
            from library import workspace_manager, value_cache_storage_manager;
            workspace_manager.singleton.setup();
            value_cache_storage_manager.singleton.display_all_items();
            workspace_manager.singleton.shutdown();\""



      typescript-account-login:
        enter-full-path: ${{ current-root-full-path }}/selection/typescript
        type: individual
        commands:
          - npm login

      rust-account-login:
        enter-full-path: ${{ current-root-full-path }}/selection/rust
        type: individual
        commands:
          - cargo login ${{ rust-cargo-io-api-key }}



      typescript-toolset-verify:
        enter-full-path: ${{ current-root-full-path }}/selection/typescript
        type: individual
        commands:
          - docker --version
          - git --version
          - gh --version
          - node --version
          - fnm --version
          - npm --version
          - bun --version
          - bunx corepack --version
          - bunx pnpm --version
          - bunx yarn --version

      rust-toolset-verify:
        enter-full-path: ${{ current-root-full-path }}/selection/rust
        type: individual
        commands:
          - rustc --version
          - rustup --version
          - cargo --version
          - cargo fmt --version
          - cargo clippy --version
          - cargo nextest --version
          - cargo audit --version
          - rustup target list



      typescript-test-unit:
        enter-full-path: ${{ current-root-full-path }}/selection/typescript
        type: individual
        commands:
          - bun run test:unit

      rust-test-unit:
        enter-full-path: ${{ current-root-full-path }}/selection/rust
        type: individual
        commands:
          - cargo test-unit



      typescript-test-benchmark:
        enter-full-path: ${{ current-root-full-path }}/selection/typescript
        type: individual
        commands:
          - bun run test:benchmark

      rust-test-benchmark:
        enter-full-path: ${{ current-root-full-path }}/selection/rust
        type: individual
        commands:
          - echo "rust-test-benchmark"



      typescript-format:
        enter-full-path: ${{ current-root-full-path }}/selection/typescript
        type: individual
        commands:
          - bun run format

      rust-format:
        enter-full-path: ${{ current-root-full-path }}/selection/rust
        type: individual
        commands:
          - cargo format-check
          - cargo format-write



      typescript-lint:
        enter-full-path: ${{ current-root-full-path }}/selection/typescript
        type: individual
        commands:
          - bun run lint

      rust-lint:
        enter-full-path: ${{ current-root-full-path }}/selection/rust
        type: individual
        commands:
          - cargo lint



      typescript-build:
        enter-full-path: ${{ current-root-full-path }}/selection/typescript
        type: individual

        commands:
          - bun run build

      rust-build:
        enter-full-path: ${{ current-root-full-path }}/selection/rust
        type: individual

        commands:
          - cargo build-debug
          - cargo build-release



      typescript-setup:
        enter-full-path: ${{ current-root-full-path }}/selection/typescript
        type: individual
        commands:
          - bun install

      rust-setup:
        enter-full-path: ${{ current-root-full-path }}/selection/rust
        type: individual
        commands:
          - echo "rust-setup"



      typescript-update:
        enter-full-path: ${{ current-root-full-path }}/selection/typescript
        type: individual
        commands:
          - bun update

      rust-update:
        enter-full-path: ${{ current-root-full-path }}/selection/rust
        type: individual
        commands:
          - cargo update



      typescript-deploy-check:
        enter-full-path: ${{ current-root-full-path }}/selection/typescript
        type: individual
        commands:
          - bun run deploy:check

      rust-deploy-check:
        enter-full-path: ${{ current-root-full-path }}/selection/rust
        type: individual
        commands:
          - cargo deploy-inspect
          - cargo deploy-check



      typescript-deploy:
        enter-full-path: ${{ current-root-full-path }}/selection/typescript
        type: individual
        commands:
          - bun run workflow:deploy

      rust-deploy:
        enter-full-path: ${{ current-root-full-path }}/selection/rust
        type: individual
        commands:
          - cargo workflow-deploy

    clean:
      is-enabled: true

      exclude:
        targets:
          - ${{ current-root-full-path }}
          - ${{ current-root-full-path }}/selection
          - ${{ current-root-full-path }}/workspace
          - ${{ current-root-full-path }}/.github  
          - ${{ current-root-full-path }}/.temporary            

      include:
        targets:
          root-temporary:
            - ${{ current-root-full-path }}/workspace/private/temporary

          typescript-temporary:
            - ${{ current-root-full-path }}/selection/typescript/output

          rust-temporary:
            - ${{ current-root-full-path }}/selection/rust/target

  log:
    is-enabled: true

    targets:
      - ${{ current-root-full-path }}/workspace/private/temporary/log/${{ current-date }}.log            

  macros:  
    value-cache:
      - current-date
      - current-year
      - current-root-full-path
      
    file:
      company-name: QLogicae

      project-name: Cor
      
      author-name: Vaughn Cedric L. Araneta
      
      author-email: vaughncedriclipardoaraneta@gmail.com

metadata:

