
data:
  selection:
    is-enabled: true

    target: "typescript"

    default:
      targets:
        - all
        - root
        - project

    project:
      targets:
        - typescript
        - python

    full-path:
      root: "{{ current-root-full-path }}"
      typescript: "{{ current-root-full-path }}/selection/typescript"      
      python: "{{ current-root-full-path }}/selection/python"


  script:
    is-enabled: true

    types:
      - individual
      - collection

    targets:
      all-value-cache-debug:
        enter-full-path: "{{ current-root-full-path }}/workspace/public/tooling"
        type: "individual"
        commands:
          - "python3 -c \"
            from library import workspace_manager, value_cache_storage_manager;
            workspace_manager.singleton.setup();
            value_cache_storage_manager.singleton.display_all_items();
            workspace_manager.singleton.shutdown();\""

      all-toolset-verify:
        type: "collection"
        commands:
          - typescript-toolset-verify    

      typescript-account-login:
        enter-full-path: "{{ current-root-full-path }}/selection/typescript"
        type: "individual"
        commands:
          - "npm login"

      typescript-toolset-verify:
        enter-full-path: "{{ current-root-full-path }}/selection/typescript"
        type: "individual"
        commands:
          - "docker --version"
          - 'git --version'
          - 'gh --version'
          - 'node --version'
          - 'fnm --version'
          - 'npm --version'
          - 'bun --version'
          - 'bunx corepack --version'
          - 'bunx pnpm --version'
          - 'bunx yarn --version'

      all-test-unit:
        type: "collection"
        commands:
          - typescript-test-unit      

      typescript-test-unit:
        enter-full-path: "{{ current-root-full-path }}/selection/typescript"
        type: "individual"
        commands:
          - "bun run test:unit"


      all-test-benchmark:
        type: "collection"
        commands:
          - typescript-test-benchmark    

      typescript-test-benchmark:
        enter-full-path: "{{ current-root-full-path }}/selection/typescript"
        type: "individual"
        commands:
          - "bun run test:benchmark"


      all-codebase-format:
        type: "collection"
        commands:
          - typescript-codebase-format    

      typescript-codebase-format:
        enter-full-path: "{{ current-root-full-path }}/selection/typescript"
        type: "individual"
        commands:
          - "bun run format"


      all-codebase-lint:
        type: "collection"
        commands:
          - typescript-codebase-lint    

      typescript-codebase-lint:
        enter-full-path: "{{ current-root-full-path }}/selection/typescript"
        type: "individual"
        commands:
          - "bun run lint"


      all-project-build:
        type: "collection"
        commands:
          - typescript-project-build    

      typescript-project-build:
        enter-full-path: "{{ current-root-full-path }}/selection/typescript"
        type: "individual"

        commands:
          - "bun run build"


      all-project-setup:
        type: "collection"
        commands:
          - typescript-project-setup    

      typescript-project-setup:
        enter-full-path: "{{ current-root-full-path }}/selection/typescript"
        type: "individual"
        commands:
          - "bun install"


      all-project-update:
        type: "collection"
        commands:
          - typescript-project-update    

      typescript-project-update:
        enter-full-path: "{{ current-root-full-path }}/selection/typescript"
        type: "individual"
        commands:
          - "bun update"


      all-project-deploy:
        type: "collection"
        commands:
          - typescript-project-deploy    

      typescript-project-deploy:
        enter-full-path: "{{ current-root-full-path }}/selection/typescript"
        type: "individual"
        commands:
          - "bun run deploy"

    clean:
      is-enabled: true

      exclude:
        targets:
          - "{{ current-root-full-path }}"
          - "{{ current-root-full-path }}/selection"
          - "{{ current-root-full-path }}/workspace"
          - "{{ current-root-full-path }}/.github"  
          - "{{ current-root-full-path }}/.temporary"            

      include:
        targets:
          root-temporary:
            - "{{ current-root-full-path }}/workspace/private/temporary"

          typescript-temporary:
            - "{{ current-root-full-path }}/selection/typescript/output"

  log:
    is-enabled: true

    targets:
      - "{{ current-root-full-path }}/workspace/private/temporary/log/{{ current-date }}.log"            

  macros:  
    value-cache:
      - current-date
      - current-root-full-path
      
    file:
      root-project-name: "QLogicae Cor1"

      current-year: "2026"
      
      company-name: "QLogicae"
      
      author-name: "Vaughn Cedric L. Araneta"
      
      author-email: "vaughncedriclipardoaraneta@gmail.com"

metadata:

