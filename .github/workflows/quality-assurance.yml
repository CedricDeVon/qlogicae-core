name: Quality Assurance

on:
    push:
    pull_request:

defaults:
    run:
        shell: bash

jobs:
    python-unit-test:
        name: Python | Unit Test
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: ./selection/python

        strategy:
            fail-fast: false
            matrix:
                python-version:
                - "3.14"

        steps:
            - uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                python-version: ${{ matrix.python-version }}

            - name: Install Hatch
              run: |
                python -m pip install --upgrade pip
                pip install hatch

            - name: Create Hatch environment
              run: hatch env create

            - name: Run unit tests
              run: hatch run workflow-test-unit
            
    typescript-unit-test:
        name: Typescript | Unit Test
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: ./selection/typescript

        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - run: bun install --frozen-lockfile
            - run: bun run workflow:test:unit

    typescript-benchmark-test:
        name: Typescript | Benchmark Test
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: ./selection/typescript

        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - run: bun install --frozen-lockfile
            - run: bun run workflow:test:benchmark

    typescript-install:
        name: Typescript | Install via ${{ matrix.package_manager }} on Node ${{ matrix.node_version }}
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                node_version: [22, 24]
                package_manager:
                    - npm
                    - pnpm
                    - yarn
                    - bun

        steps:
            - if: matrix.package_manager == 'npm'
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node_version }}

            - if: matrix.package_manager == 'pnpm'
              uses: pnpm/action-setup@v4
              with:
                  version: latest

            - if: matrix.package_manager == 'pnpm'
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node_version }}

            - if: matrix.package_manager == 'yarn'
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node_version }}

            - if: matrix.package_manager == 'bun'
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - run: sleep 15

            - if: matrix.package_manager == 'npm'
              run: npm install qlogicae-cor1@latest

            - if: matrix.package_manager == 'pnpm'
              run: pnpm add qlogicae-cor1@latest

            - if: matrix.package_manager == 'yarn'
              run: yarn add qlogicae-cor1@latest

            - if: matrix.package_manager == 'bun'
              run: bun add qlogicae-cor1@latest
